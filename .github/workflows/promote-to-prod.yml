name: Reusable Staging to Prod Promotion

on:
  workflow_call:
    inputs:
      source_branch:
        type: string
        required: false
        default: staging
      target_branch:
        type: string
        required: false
        default: prod
      head_sha:
        type: string
        required: true
      deployment_summary:
        type: string
        required: false
        default: ""
    outputs:
      pull_request_number:
        description: Promotion pull request number
        value: ${{ jobs.promote.outputs.pull_request_number }}

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  promote:
    name: Create or update staging to prod PR
    runs-on: ubuntu-latest
    outputs:
      pull_request_number: ${{ steps.promote.outputs.pull_request_number }}
    steps:
      - name: Create or update promotion PR
        id: promote
        uses: actions/github-script@v7
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          HEAD_SHA: ${{ inputs.head_sha }}
          DEPLOYMENT_SUMMARY: ${{ inputs.deployment_summary }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const source = process.env.SOURCE_BRANCH;
            const target = process.env.TARGET_BRANCH;
            const headSha = process.env.HEAD_SHA;
            const summary = process.env.DEPLOYMENT_SUMMARY || 'Staging deployment and smoke checks passed.';
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: target,
              head: owner + ':' + source,
            });
            if (openPulls.length > 1) {
              core.setFailed('More than one open ' + source + ' to ' + target + ' promotion PR exists.');
              return;
            }
            const title = 'Promote ' + source + ' to ' + target;
            const body = [
              'Automated promotion from ' + source + ' to ' + target + '.',
              '',
              'Staging SHA: ' + headSha,
              'Status: ' + summary,
              '',
              'This PR is updated by successful staging deployments. Merge remains manual.',
            ].join('\n');
            let pullRequest;
            if (openPulls.length === 0) {
              const created = await github.rest.pulls.create({ owner, repo, title, head: source, base: target, body });
              pullRequest = created.data;
            } else {
              const updated = await github.rest.pulls.update({ owner, repo, pull_number: openPulls[0].number, title, body });
              pullRequest = updated.data;
            }
            await github.rest.checks.create({
              owner,
              repo,
              name: 'staging-promotion',
              head_sha: headSha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Staging promotion ready',
                summary: summary + ' Commit ' + headSha + ' is ready for manual promotion.',
              },
            });
            core.setOutput('pull_request_number', String(pullRequest.number));
