name: Scheduled Secret History Scan

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          version_number="${version#v}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${version}/gitleaks_${version_number}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history with redacted output
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --redact --report-format sarif --report-path /tmp/gitleaks-history.sarif --exit-code 1

      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gitleaks-history-${{ github.run_id }}
          path: /tmp/gitleaks-history.sarif
          if-no-files-found: ignore
          retention-days: 7
