name: Reusable Render Image Bootstrap

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build
        required: true
        type: string
      backend_image_name:
        description: GHCR image name for the Node microservice image
        required: true
        type: string
      analytics_image_name:
        description: GHCR image name for the Python analytics image
        required: true
        type: string
      backend_dockerfile:
        description: Dockerfile for the Node microservice image
        required: false
        default: Dockerfile.backend
        type: string
      analytics_dockerfile:
        description: Dockerfile for the Python analytics image
        required: false
        default: Dockerfile.analytics
        type: string
      docker_context:
        description: Docker build context
        required: false
        default: .
        type: string
      tag:
        description: Bootstrap tag to publish
        required: false
        default: bootstrap
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Render bootstrap images
    runs-on: ubuntu-latest
    steps:
      - name: Validate bootstrap inputs
        env:
          DEPLOY_REF: ${{ inputs.ref }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "tag contains unsupported characters" >&2
            exit 1
          fi

      - name: Check out the exact build ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Node bootstrap image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.backend_dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ inputs.backend_image_name }}:${{ inputs.tag }}
          cache-from: type=gha,scope=paulus-backend
          cache-to: type=gha,mode=max,scope=paulus-backend

      - name: Build and push the Python bootstrap image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.analytics_dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ inputs.analytics_image_name }}:${{ inputs.tag }}
          cache-from: type=gha,scope=paulus-analytics
          cache-to: type=gha,mode=max,scope=paulus-analytics

      - name: Scan the Node bootstrap image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ inputs.backend_image_name }}:${{ inputs.tag }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan the Python bootstrap image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ inputs.analytics_image_name }}:${{ inputs.tag }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
