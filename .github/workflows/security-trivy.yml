name: Reusable Trivy Image Scan

on:
  workflow_call:
    inputs:
      image:
        description: Fully qualified image reference or digest
        type: string
        required: true
      severity:
        description: Trivy severities that fail the scan
        type: string
        required: false
        default: HIGH,CRITICAL

jobs:
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: ${{ inputs.severity }}
